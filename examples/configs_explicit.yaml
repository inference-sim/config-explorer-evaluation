# BLIS Config Space for Parallel Search
# This file defines the config space to explore

model: codellama/CodeLlama-34b-Instruct-hf
hardware: H100
vllm_version: vllm/vllm-openai:v0.8.4
num_requests: 100

# BLIS Roofline model parameters (paths relative to BLIS_ROOT env var, default: current directory)
# Note: model_config_folder is automatically constructed as model_config_folder_base/{model_name}
model_config_folder_base: model_configs
hardware_config: hardware_config.json

# Workload parameters (used if trace_file not provided)
prefix_tokens: 129
prompt_tokens: 2871
prompt_tokens_stdev: 945
prompt_tokens_min: 1
prompt_tokens_max: 4054
output_tokens: 1
output_tokens_stdev: 1
output_tokens_min: 1
output_tokens_max: 2

# SLO constraints (applied to all configs)
slos:
  - metric: e2e_p95_ms
    threshold_ms: 1000

# Config space to search
# Each config will be evaluated in parallel
configs:
  - tp: 1
    batch_size: 128
    max_scheduled_tokens: 1024
    max_model_len: 4096
    gpu_memory_utilization: 0.90
    block_size: 16

  - tp: 2
    batch_size: 128
    max_scheduled_tokens: 2048
    max_model_len: 4096
    gpu_memory_utilization: 0.90
    block_size: 16

  - tp: 1
    batch_size: 256
    max_scheduled_tokens: 4096
    max_model_len: 8192
    gpu_memory_utilization: 0.90
    block_size: 16

  - tp: 2
    batch_size: 256
    max_scheduled_tokens: 4096
    max_model_len: 8192
    gpu_memory_utilization: 0.95
    block_size: 16

  - tp: 1
    batch_size: 512
    max_scheduled_tokens: 8192
    max_model_len: 16384
    gpu_memory_utilization: 0.85
    block_size: 16
