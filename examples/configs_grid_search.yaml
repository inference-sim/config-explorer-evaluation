# BLIS Grid Search Config - Automatic Cartesian Product
# This file uses grid search format where you specify lists of values
# for each parameter and all combinations are automatically generated

model: codellama/CodeLlama-34b-Instruct-hf
hardware: H100
vllm_version: vllm/vllm-openai:v0.8.4
num_requests: 100

# Roofline model parameters
# Note: model_config_folder is automatically constructed as model_config_folder_base/{model_name}
model_config_folder_base: /Users/dipanwitaguhathakurta/Downloads/inference-sim-package/config-explorer-evaluation/model_configs
hardware_config: /Users/dipanwitaguhathakurta/Downloads/inference-sim-package/config-explorer-evaluation/hardware_config.json

# Workload parameters (used if trace_file not provided)
prefix_tokens: 129
prompt_tokens: 2871
prompt_tokens_stdev: 945
prompt_tokens_min: 1
prompt_tokens_max: 4054
output_tokens: 1
output_tokens_stdev: 1
output_tokens_min: 1
output_tokens_max: 2

# SLO constraints (applied to all configs)
slos:
  - metric: e2e_p95_ms
    threshold_ms: 1000

# Grid search parameters
# Provide lists of values to sweep over
# All combinations will be generated automatically (Cartesian product)

tp: [1, 2]
batch_size: [128, 256, 512]
max_scheduled_tokens: [2048, 4096]
max_model_len: [4096, 8192]
gpu_memory_utilization: [0.90]
block_size: [16]